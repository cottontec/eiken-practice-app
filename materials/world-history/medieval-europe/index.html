/* Layout: 問題冊子とマークシートを一枚にまとめた縦長の紙面。上部に固定の解答状況バー */
:root {

  --lapis: #29469a;
  --lapis-soft: #e6ebf7;

  --ng-soft: #fbe7e5;

  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --sheet: #1a1f29; --ink: #e5e8ef; --muted: #9aa3b5; --rule: #2e3543;
    --lapis: #8fa8ec; --lapis-soft: #232c45; --ok: #6fcf9b; --ok-soft: #173326; --ng: #f08a80; --ng-soft: #3a1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #1a1f29; --ink: #e5e8ef; --muted: #9aa3b5; --rule: #2e3543;
  --lapis: #8fa8ec; --lapis-soft: #232c45; --ok: #6fcf9b; --ok-soft: #173326; --ng: #f08a80; --ng-soft: #3a1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); line-height: 1.7; }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.cover { display: grid; gap: 6px; padding-block: 8px 20px; border-bottom: 2px solid var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--font-q); font-size: clamp(24px, 5vw, 32px); margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.notes { font-size: 13px; color: var(--muted); margin: 14px 0 0; padding-left: 1.2em; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; margin-bottom: 8px; }
.bar .count { font-variant-numeric: tabular-nums; font-size: 14px; }
.bar .timer { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.bar .spacer { flex: 1; }
button { font-family: var(--font-ui); font-size: 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--lapis); border-color: var(--lapis); color: var(--sheet); font-weight: 700; }
button:focus-visible, .choice:focus-within { outline: 2px solid var(--lapis); outline-offset: 2px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
section.daimon { margin-top: 36px; }
.daimon h2 { font-family: var(--font-q); font-size: 20px; margin: 0 0 10px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.daimon h2 .no { border: 1.5px solid var(--ink); padding: 0 10px; font-size: 17px; }
.lead { background: var(--sheet); border: 1px solid var(--rule); padding: 16px 18px; font-family: var(--font-q); font-size: 15px; }
.lead p { margin: 0 0 8px; }
.lead p:last-child { margin: 0; }
.lead .sp { font-family: var(--font-ui); font-weight: 700; font-size: 13px; margin-right: 6px; }
.blank { display: inline-block; border: 1px solid var(--ink); min-width: 2.2em; text-align: center; padding: 0 4px; margin: 0 2px; font-family: var(--font-ui); font-size: 13px; line-height: 1.5; }
.u { text-decoration: underline; text-underline-offset: 4px; }
article.q { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--rule); }
.qhead { font-family: var(--font-q); font-size: 15.5px; }
.qhead b { font-family: var(--font-ui); margin-right: 8px; }
.material { margin: 10px 0; border-left: 3px solid var(--rule); padding: 8px 14px; font-family: var(--font-q); font-size: 14.5px; background: var(--sheet); }
.material .src { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-top: 6px; }
.items { margin: 10px 0; display: grid; gap: 4px; font-family: var(--font-q); font-size: 15px; }
.items div { display: grid; grid-template-columns: 2.4em 1fr; }
.choices { display: grid; gap: 6px; margin-top: 10px; }
.choices.grid6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .choices.grid6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.choice { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); cursor: pointer; font-family: var(--font-q); font-size: 15px; min-width: 0; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.bubble { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--lapis); color: var(--lapis); display: grid; place-items: center; font-family: var(--font-ui); font-size: 13px; font-weight: 700; }
.choice:has(input:checked) { border-color: var(--lapis); background: var(--lapis-soft); }
.choice:has(input:checked) .bubble { background: var(--lapis); color: var(--sheet); }
.combo { width: 100%; border-collapse: collapse; font-family: var(--font-q); font-size: 15px; }
.choice .combo td { padding: 0 10px 0 0; }
.choice .combo td.k { font-family: var(--font-ui); font-size: 12px; color: var(--muted); white-space: nowrap; width: 1%; }
.graded .choice { cursor: default; }
.graded .choice.is-answer { border-color: var(--ok); background: var(--ok-soft); }
.graded .choice.is-answer .bubble { border-color: var(--ok); color: var(--ok); }
.graded .choice.is-answer:has(input:checked) .bubble { background: var(--ok); color: var(--sheet); }
.graded .choice.is-wrong { border-color: var(--ng); background: var(--ng-soft); }
.graded .choice.is-wrong .bubble { border-color: var(--ng); background: var(--ng); color: var(--sheet); }
.verdict { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; margin-left: 6px; font-family: var(--font-ui); }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--ng-soft); color: var(--ng); }
.explain { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); font-size: 14px; }
.explain h4 { margin: 0 0 6px; font-size: 13px; color: var(--lapis); letter-spacing: .04em; }
.explain ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.explain li { display: grid; grid-template-columns: 2em 1fr; }
.explain .point { margin-top: 8px; color: var(--muted); }
.result { margin-top: 18px; background: var(--sheet); border: 2px solid var(--ink); padding: 16px 18px; display: grid; gap: 10px; }
.result .score { font-family: var(--font-q); font-size: 28px; font-variant-numeric: tabular-nums; }
.result table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.result td, .result th { border-bottom: 1px solid var(--rule); padding: 4px 14px 4px 0; text-align: left; }
.sheetmap { display: flex; flex-wrap: wrap; gap: 4px; }
.sheetmap a { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 4px; font-size: 12px; color: var(--muted); text-decoration: none; background: var(--sheet); font-variant-numeric: tabular-nums; }
.sheetmap a.done { border-color: var(--lapis); color: var(--lapis); font-weight: 700; }
.sheetmap a.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.sheetmap a.ng { border-color: var(--ng); color: var(--ng); background: var(--ng-soft); }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

      "point": "百年戦争（1339〜1453年。1337年開戦とする説もある）→バラ戦争→テューダー朝（ヘンリ7世）の順で、イギリスの王権が強まっていく。"
    },
    {
      "no": 20, "section": 4, "type": "order",
      "stem": "下線部 <u>教会の権威は大きく揺らいだ</u> に関連して、次の出来事Ⅰ〜Ⅲが年代の古いものから順に正しく配列されているものを、下の①〜⑥のうちから一つ選べ。",
      "items": ["コンスタンツ公会議が開かれ、フスが異端として処刑された。", "ローマとアヴィニョンにそれぞれ教皇が立ち、教会大分裂（大シスマ）が始まった。", "教皇庁が南フランスのアヴィニョンに移された。"],
      "years": [1414, 1378, 1309],
      "answer": 6,
      "explain_items": ["Ⅰ コンスタンツ公会議は1414〜18年。教会大分裂を終わらせ、フスを処刑した（1415年）。", "Ⅱ 教会大分裂の開始は1378年。", "Ⅲ 教皇庁のアヴィニョン移転は1309年（〜1377年。「教皇のバビロン捕囚」）。"],
      "point": "Ⅲ（1309年）→Ⅱ（1378年）→Ⅰ（1414年）。アナーニ事件（1303年）→バビロン捕囚→大シスマ→コンスタンツ公会議の順。"
    }
  ]
}

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('exam-data').textContent);
  const NUM = ['①','②','③','④','⑤','⑥'];
  const ROMAN = ['Ⅰ','Ⅱ','Ⅲ'];
  const ORDERS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  const TF = [[true,true],[true,false],[false,true],[false,false]];
  const KEY = 'medieval-europe-answers-v1';
  const exam = document.getElementById('exam');
  let answers = {};
  let graded = false;
  try { answers = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { answers = {}; }

  const blanks = s => s.replace(/\[([^\]]+)\]/g, '<span class="blank">$1</span>').replace(/<u>/g, '<span class="u">').replace(/<\/u>/g, '</span>');

  function choiceList(q) {
    if (q.type === 'order') return ORDERS.map(o => o.map(i => ROMAN[i]).join(' → '));
    if (q.type === 'tf') return TF.map(t => `a ${t[0] ? '正' : '誤'}　b ${t[1] ? '正' : '誤'}`);
    return q.choices;
  }

  function renderQuestion(q) {
    const art = document.createElement('article');
    art.className = 'q';
    art.id = 'q' + q.no;
    let html = `<div class="qhead"><b>問${q.no}</b>${blanks(q.stem)}<span class="vslot"></span></div>`;
    if (q.material) html += `<div class="material">${q.material}<div class="src">${q.materialSrc}</div></div>`;
    if (q.items) html += `<div class="items">${q.items.map((t, i) => `<div><span>${ROMAN[i]}</span><span>${t}</span></div>`).join('')}</div>`;
    if (q.statements) html += `<div class="items">${q.statements.map((t, i) => `<div><span>${'ab'[i]}</span><span>${t}</span></div>`).join('')}</div>`;
    const list = choiceList(q);
    html += `<div class="choices${list.length === 6 ? ' grid6' : ''}">`;
    list.forEach((c, i) => {
      const body = q.type === 'combo'
        ? `<table class="combo"><tr>${q.keys.map((k, j) => `<td class="k">${k}</td><td>${c[j]}</td>`).join('')}</tr></table>`
        : `<span>${c}</span>`;
      html += `<label class="choice" data-i="${i + 1}"><input type="radio" name="q${q.no}" id="q${q.no}c${i + 1}" value="${i + 1}"><span class="bubble">${NUM[i]}</span>${body}</label>`;
    });
    html += `</div><div class="exslot"></div>`;
    art.innerHTML = html;
    const sel = answers[q.no];
    if (sel) { const r = art.querySelector(`input[value="${sel}"]`); if (r) r.checked = true; }
    art.addEventListener('change', e => {
      if (graded) return;
      answers[q.no] = Number(e.target.value);
      save(); updateBar();
    });
    return art;
  }

  DATA.sections.forEach(sec => {
    const s = document.createElement('section');
    s.className = 'daimon';
    s.innerHTML = `<h2><span class="no">第${sec.no}問</span>${sec.title}</h2><div class="lead">${sec.lead.map(([sp, t]) => `<p>${sp ? `<span class="sp">${sp}</span>` : ''}${blanks(t)}</p>`).join('')}</div>`;
    DATA.questions.filter(q => q.section === sec.no).forEach(q => s.appendChild(renderQuestion(q)));
    exam.appendChild(s);
  });

  const map = document.getElementById('sheetmap');
  DATA.questions.forEach(q => { const a = document.createElement('a'); a.href = '#q' + q.no; a.textContent = q.no; a.id = 'm' + q.no; map.appendChild(a); });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }
  function updateBar() {
    const n = Object.keys(answers).length;
    document.getElementById('count').textContent = graded ? document.getElementById('count').textContent : `解答 ${n} / 20`;
    DATA.questions.forEach(q => { const m = document.getElementById('m' + q.no); if (!graded) m.className = answers[q.no] ? 'done' : ''; });
  }

  function explanationHTML(q) {
    let rows;
    if (q.explain) rows = q.explain.map((t, i) => `<li><span>${NUM[i]}</span><span>${t}</span></li>`);
    else rows = q.explain_items.map(t => `<li><span>${t.slice(0, 1)}</span><span>${t.slice(2)}</span></li>`);
    return `<div class="explain"><h4>正解 ${NUM[q.answer - 1]}　解説</h4><ul>${rows.join('')}</ul><div class="point">${q.point}</div></div>`;
  }

  function grade() {
    graded = true;
    exam.classList.add('graded');
    let total = 0;
    const bySec = {};
    DATA.questions.forEach(q => {
      const art = document.getElementById('q' + q.no);
      art.querySelectorAll('input').forEach(i => i.disabled = true);
      const sel = answers[q.no];
      const ok = sel === q.answer;
      if (ok) total += 5;
      bySec[q.section] = (bySec[q.section] || 0) + (ok ? 5 : 0);
      art.querySelectorAll('.choice').forEach(l => {
        const i = Number(l.dataset.i);
        if (i === q.answer) l.classList.add('is-answer');
        else if (i === sel) l.classList.add('is-wrong');
      });
      art.querySelector('.vslot').innerHTML = `<span class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解' : (sel ? '不正解' : '未解答')}</span>`;
      art.querySelector('.exslot').innerHTML = explanationHTML(q);
      document.getElementById('m' + q.no).className = ok ? 'ok' : 'ng';
    });
    document.getElementById('count').textContent = `得点 ${total} / 100`;
    const rows = DATA.sections.map(s => `<tr><td>第${s.no}問 ${s.title}</td><td>${bySec[s.no] || 0} / 25</td></tr>`).join('');
    document.getElementById('result').innerHTML = `<div class="result"><div class="score">${total} 点 / 100 点</div><table><tbody>${rows}</tbody></table><div>間違えた問題は、解説の「ポイント」を読んでから、もう一度選択肢を一つずつ検討してみましょう。</div></div>`;
    stopTimer();
    document.getElementById('gradeBtn').disabled = true;
    document.getElementById('result').scrollIntoView();
  }

  document.getElementById('gradeBtn').addEventListener('click', grade);
  const confirmBox = document.getElementById('resetConfirm');
  document.getElementById('resetBtn').addEventListener('click', () => { confirmBox.hidden = false; });
  document.getElementById('resetNo').addEventListener('click', () => { confirmBox.hidden = true; });
  document.getElementById('resetYes').addEventListener('click', () => {
    answers = {}; save(); graded = false; confirmBox.hidden = true;
    exam.classList.remove('graded');
    document.querySelectorAll('#exam input').forEach(i => { i.checked = false; i.disabled = false; });
    document.querySelectorAll('.choice').forEach(l => l.classList.remove('is-answer', 'is-wrong'));
    document.querySelectorAll('.vslot, .exslot').forEach(e => e.innerHTML = '');
    document.getElementById('result').innerHTML = '';
    document.getElementById('gradeBtn').disabled = false;
    stopTimer(); remain = 3000; drawTimer();
    updateBar();
  });

  let remain = 3000, tid = null;
  const tEl = document.getElementById('timer'), tBtn = document.getElementById('timerBtn');
  function drawTimer() { const m = Math.floor(remain / 60), s = remain % 60; tEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; tBtn.textContent = tid ? 'タイマー停止' : 'タイマー開始'; }
  function stopTimer() { if (tid) { clearInterval(tid); tid = null; } drawTimer(); }
  tBtn.addEventListener('click', () => {
    if (tid) { stopTimer(); return; }
    tid = setInterval(() => { remain = Math.max(0, remain - 1); if (remain === 0) { stopTimer(); tEl.textContent = '終了 00:00'; } else drawTimer(); }, 1000);
    drawTimer();
  });

  updateBar();
})();
</script>
